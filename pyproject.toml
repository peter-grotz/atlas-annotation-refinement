[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-refine"
version = "0.1.0"
description = "Atlas annotation propagation and ground-truth-anchored refinement for volumetric microscopy cohorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
    "pynrrd>=1.0",
    "antspyx>=0.4",
    "SimpleITK>=2.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
atlas-refine = "atlas_refine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the package from the source tree, so it need not be installed
# first. Without this, a fresh clone fails at collection rather than at a test.
pythonpath = ["src"]
